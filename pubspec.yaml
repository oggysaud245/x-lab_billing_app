name: xlab_billing
description: "Bilingual (English/Nepali) billing, receipt & thermal printer app for the XLab XTKP607UL."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization resource generation uses intl pinned by the SDK.
  intl: any

  cupertino_icons: ^1.0.8

  # Local persistence
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # State management
  provider: ^6.1.5

  # Bikram Sambat (Nepali calendar) conversion, well-tested package.
  bikram_sambat: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # In-memory SQLite for unit tests.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
